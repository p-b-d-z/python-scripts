<!DOCTYPE html>
<html>
<head>
    <title>Agent Login</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="/static/logo.png" alt="Tier 3 Consulting Logo" class="logo">
            <h1>Agent Login</h1>
            <p>Secure access to the IVR system</p>
        </div>
        <p>Enter your phone number to register as an available agent.</p>
        <form method="post">
            <div class="form-group">
                <label for="phone_number">Phone Number:</label>
                <input type="tel" id="phone_number" name="phone_number" placeholder="+1234567890" required>
            </div>
            <button type="submit">Login as Agent</button>
        </form>
        <div class="nav-links">
            <a href="/consent">Consent</a>
            <a href="/">Home</a>
        </div>
    </div>
</body>
</html>
